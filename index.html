<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Content Security Policy. This is the mechanical guarantee behind the
      privacy claim: the browser itself refuses any connection from this page.
        connect-src 'none'  -> no fetch / XHR / WebSocket / beacon, to anywhere
        default-src 'none'  -> nothing loads unless a directive below allows it
        img-src blob:       -> previews of the user's own in-memory images only
        manifest-src 'self' -> the web app manifest (installable, file handler), same origin
        worker-src blob:    -> the worker is started from a blob: URL so that it
                               inherits this policy; a worker started from a
                               same-origin URL would NOT be covered by a meta CSP
        'wasm-unsafe-eval'  -> lets the browser compile WebAssembly (the image
                               codecs). It does NOT permit JavaScript eval() or
                               new Function(), and it opens no network path.
      In `vite dev` ONLY, vite.config.ts relaxes connect-src for hot reload.
      `vite build` and `vite preview` (what the e2e suite tests) ship this exactly.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob:; worker-src blob:; connect-src 'none'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Image format converter that runs entirely in your browser and tells you exactly what a conversion throws away. PNG, JPEG, WebP, AVIF, JPEG XL and TIFF. Image bytes are never transmitted anywhere." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1319" />
    <meta property="og:title" content="Airgap — image converter that never uploads" />
    <meta property="og:description" content="Convert PNG, JPEG, WebP, AVIF, JPEG XL and TIFF entirely in your browser, and see exactly what each conversion discards before and after." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <title>Airgap</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <main id="app" aria-busy="true">
      <noscript>Airgap needs JavaScript: the conversion runs in your browser, not on a server.</noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
