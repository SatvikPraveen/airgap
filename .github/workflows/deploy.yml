name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the current one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The full suite (typecheck, unit, browser, e2e) from ci.yml. The deploy job
  # below `needs` it, so a failing test blocks the deployment.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: build and deploy dist/
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` = typecheck + `vite build` with base '/airgap/' (vite.config.ts).
      - run: npm run build

      - name: Report bundle sizes
        run: node scripts/bundle-report.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
