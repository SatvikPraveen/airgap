name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the current one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The full suite (typecheck, unit, browser, e2e) from ci.yml. The deploy job
  # below `needs` it, so a failing test blocks the deployment.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: build and deploy dist/
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` = notices check + typecheck + `vite build` with base '/airgap/'
      # (vite.config.ts) + dist/checksums.txt (SHA-256 of every shipped file).
      - run: npm run build
        env:
          AIRGAP_COMMIT: ${{ github.sha }}

      - name: Report bundle sizes
        run: node scripts/bundle-report.mjs

      - name: Bundle size budget
        run: npm run check:budget

      # Build provenance: a signed statement that this workflow, at this commit,
      # produced these exact checksums. Anyone can verify what the site serves:
      #   gh attestation verify checksums.txt --repo ${{ github.repository }}
      #   sha256sum -c checksums.txt   (against files fetched from the site)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/checksums.txt

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
