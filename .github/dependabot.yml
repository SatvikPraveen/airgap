version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - "/tools/libavif"
      - "/tools/libjxl"
    schedule:
      interval: monthly
    # vendor/ holds the codecs built with this exact emsdk, and
    # codecs-reproducible.yml checks a rebuild matches them byte for byte.
    # A new emsdk changes the output, so it is upgraded by hand together with
    # a vendor/ rebuild, never as a bare version bump.
    ignore:
      - dependency-name: "emscripten/emsdk"
    groups:
      docker-images:
        patterns: ["*"]
